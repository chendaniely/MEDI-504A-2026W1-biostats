project:
  type: website
  execute-dir: project
  render:
    - index.qmd
    - example.qmd
    - setup-local.qmd
    - setup-codespaces.qmd
    - lecture-01/*.qmd
    - lecture-01/slides/*.qmd
    - lecture-02/*.qmd
    # homework.qmd and homework_solution.qmd are left out on purpose:
    # they render as individual documents, not website pages
    - homework-instructions.qmd

website:
  title: "MEDI 504A: Biostatistics with Tidyverse"
  site-url: https://chendaniely.github.io/MEDI-504A-2026W1-biostats/
  repo-url: https://github.com/chendaniely/MEDI-504A-2026W1-biostats
  navbar:
    left:
      - href: setup-local.qmd
        text: Local setup
      - href: setup-codespaces.qmd
        text: Codespaces
      - href: example.qmd
        text: Example
    right:
      - icon: github
        text: GitHub
        href: https://github.com/chendaniely/MEDI-504A-2026W1-biostats
        aria-label: GitHub repository
  page-footer:
    center: "Prose: CC BY-NC-SA 4.0 · Code: MIT"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - section: "Lecture 1: Tidy data (Mon, Nov 2)"
        contents:
          - lecture-01/01-welcome.qmd
          - lecture-01/02-tidy-data.qmd
          - lecture-01/03-wrangle-visualize.qmd
          - lecture-01/04-tidy-to-models.qmd
          - lecture-01/05-extra-functions.qmd
          - href: lecture-01/05-observational-units.qmd
            text: "Observational units (optional)"
      - section: "Lecture 2: Modelling lab (Wed, Nov 4)"
        contents:
          - lecture-02/01-clone-the-repo.qmd
          - lecture-02/02-clean-and-tidy.qmd
          - lecture-02/03-linear-regression.qmd
          - lecture-02/04-logistic-regression.qmd
      - href: homework-instructions.qmd
        text: Homework

# The UBC brand (UBC-MDS/ubc-quarto-brand): colours, fonts and light/dark mode.
format:
  ubc-html:
    toc: true
