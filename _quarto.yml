project:
  type: website
  execute-dir: project
  render:
    - index.qmd
    - example.qmd
    - setup-local.qmd
    - setup-codespaces.qmd
    - lecture-01/*.qmd
    - lecture-01/slides/*.qmd
    - lecture-02/*.qmd
    - lecture-02/slides/*.qmd
    - lecture-02-solutions/*.qmd
    # homework.qmd and homework_solution.qmd are left out on purpose:
    # they render as individual documents, not website pages
    - homework-instructions.qmd
    # Class notes: each session's transcript, notes, and slides, and the prompt.
    # plaud.md (just the recording's link) is left out.
    - class-notes.qmd
    - README-prompt.md
    - prompt-notes.md
    - sessions/*/transcript-plaud.md
    - sessions/*/notes-*.md
    - sessions/*/materials.md

website:
  title: "MEDI 504A: Biostatistics with Tidyverse"
  site-url: https://chendaniely.github.io/MEDI-504A-2026W1-biostats/
  repo-url: https://github.com/chendaniely/MEDI-504A-2026W1-biostats
  navbar:
    left:
      - href: homework-instructions.qmd
        text: Homework
      - href: setup-local.qmd
        text: Local setup
      - href: setup-codespaces.qmd
        text: Codespaces
      - href: example.qmd
        text: Example
    right:
      - icon: github
        text: GitHub
        href: https://github.com/chendaniely/MEDI-504A-2026W1-biostats
        aria-label: GitHub repository
  page-footer:
    center: "Prose: CC BY-NC-SA 4.0 · Code: MIT"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - section: "Lecture 1: Tidy data (Mon, Nov 2)"
        contents:
          - lecture-01/01-welcome.qmd
          - lecture-01/02-tidy-data.qmd
          - lecture-01/03-wrangle-visualize.qmd
          - lecture-01/04-tidy-to-models.qmd
      - section: "Lecture 2: Modelling lab (Wed, Nov 4)"
        contents:
          - lecture-02/01-clone-the-repo.qmd
          - lecture-02/02-clean-and-tidy.qmd
          - lecture-02/03-observational-units.qmd
          - lecture-02/04-linear-regression.qmd
          - lecture-02/05-logistic-regression.qmd
          - lecture-02/06-extra-functions.qmd
      # Homework is in the navbar, not here: a navbar link that is also in the
      # sidebar is marked as the current page on every page.
      - section: "AI Class Notes"
        href: class-notes.qmd
        contents:
          - section: "Lecture 1 (Mon, Nov 2)"
            contents:
              - href: sessions/2026-11-02/notes-class-main--claude-opus-5-5.md
                text: Claude Opus notes
              - href: sessions/2026-11-02/notes-class-main--qwen3.6-35b-a3b.md
                text: Qwen 3.6 notes
              - href: sessions/2026-11-02/notes-class-main--qwen3.8-27b-sglang.md
                text: Qwen 3.8 notes
              - href: sessions/2026-11-02/notes-plaud.md
                text: Plaud notes
              - href: sessions/2026-11-02/transcript-plaud.md
                text: Transcript
              - href: sessions/2026-11-02/materials.md
                text: Slides used
          - href: README-prompt.md
            text: How the notes are made
          - href: prompt-notes.md
            text: The prompt
      - section: "Extra practice"
        contents:
          - lecture-02/07-practice-clean-and-tidy.qmd
          - lecture-02/08-practice-linear-regression.qmd
          - lecture-02/09-practice-logistic-regression.qmd
      # Starts collapsed: collapse-solutions.html closes it
      # unless the page is one of the solutions.
      - section: "Solutions"
        contents:
          - lecture-02-solutions/02-clean-and-tidy.qmd
          - lecture-02-solutions/04-linear-regression.qmd
          - lecture-02-solutions/05-logistic-regression.qmd
          - lecture-02-solutions/07-practice-clean-and-tidy.qmd
          - lecture-02-solutions/08-practice-linear-regression.qmd
          - lecture-02-solutions/09-practice-logistic-regression.qmd

# custom-callout: define new callout types under `custom-callout:` (none yet).
# include-code-files: show a code file in a page, `{.r include="file.R"}`.
# The slide-only extensions (a11y, pointer, cascade) are in each slides/_metadata.yml.
filters:
  - custom-callout
  - include-code-files

# The UBC brand (UBC-MDS/ubc-quarto-brand): colours, fonts and light/dark mode.
format:
  ubc-html:
    toc: true
    # Starts the sidebar's Solutions section collapsed.
    include-after-body: collapse-solutions.html
